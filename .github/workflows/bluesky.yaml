name: Post New Posts to Bluesky

on:
  workflow_run:
    workflows: [ "Hugo Build and Deploy to S3" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      post_file:
        description: 'Path to a specific post to announce (e.g. content/posts/foo.md), bypassing new-file detection'
        required: false

jobs:
  skeet:
    name: Post new posts to Bluesky
    runs-on: ubuntu-latest
    # Wait for the S3 deploy to actually finish (and succeed) before announcing,
    # so the post's link isn't live before the site is. Only fires for the S3
    # workflow's master-branch runs, not its pull_request build-check runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Find and post new posts
        env:
          BLUESKY_HANDLE: alastair-hm.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY }}
          BASE_URL: https://blog.0x32.co.uk
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          POST_FILE: ${{ github.event.inputs.post_file }}
        run: |
          set -euo pipefail

          if [ -n "${POST_FILE:-}" ]; then
            latest_file="${POST_FILE}"
            if [ ! -f "${latest_file}" ]; then
              echo "Given post_file does not exist: ${latest_file}" >&2
              exit 1
            fi
            if grep -q '^draft: true' "${latest_file}"; then
              echo "Refusing to post a draft: ${latest_file}" >&2
              exit 1
            fi
          else
            # Fall back to diffing against the parent commit if the "before" SHA
            # isn't reachable (e.g. first push, force-push, or a zero SHA).
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              base="${BEFORE_SHA}"
            else
              base="${AFTER_SHA}^"
            fi

            added_files=$(git diff --name-status --diff-filter=A "${base}" "${AFTER_SHA}" -- 'content/posts/*.md' | cut -f2)

            if [ -z "${added_files}" ]; then
              echo "No new posts in this push."
              exit 0
            fi

            # A push/merge can add more than one post (e.g. a squash of several
            # post branches). Only post once per merge, for the latest post by
            # its front-matter date.
            latest_file=""
            latest_date=""
            while IFS= read -r file; do
              [ -z "${file}" ] && continue

              if grep -q '^draft: true' "${file}"; then
                echo "Skipping draft: ${file}"
                continue
              fi

              post_date=$(grep -m1 '^date:' "${file}" | sed -E 's/^date: *//')
              if [ -z "${latest_date}" ] || [[ "${post_date}" > "${latest_date}" ]]; then
                latest_date="${post_date}"
                latest_file="${file}"
              fi
            done <<< "${added_files}"

            if [ -z "${latest_file}" ]; then
              echo "No non-draft posts to announce."
              exit 0
            fi
          fi

          python .github/scripts/bluesky_post.py "${latest_file}"
