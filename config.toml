baseURL = "https://blog.0x32.co.uk/"
locale = "en-us"
title = "0x32++"
theme = ["ananke"]

SectionPagesMenu = "main"
enableRobotsTxt = true
disqusShortname = "0x32"

[pagination]
pagerSize = 10

 [params]
   favicon = "/favicon.ico"
   site_logo = "/logo.png"
   description = "Views from the wrong side of 0x32"
   rss = "https://blog.0x32.co.uk/index.xml"
   featured_image = "Electron.jpg"
   goatcounter = "0x32"

[params.ananke]
  show_categories = true
  copy_code = true

[params.ananke.social.share]
networks = [
  "bluesky",
  "x-twitter",
  "facebook",
  "pinterest",
  "reddit",
  "email"
]

[params.ananke.social.follow]
networks = [
  "bluesky",
  "instagram",
  "github",
  "mastodon",
  "rss"
]

[params.ananke.social.bluesky]
username = "alastair-hm.bsky.social"

[params.ananke.social.instagram]
username = "alastair_hm"

[params.ananke.social.github]
username = "alastairhm"

[params.ananke.social.mastodon]
username = "@alastair_hm@mastodon.social"
profilelink = "https://mastodon.social/@alastair_hm"

[params.ananke.social.rss]
profilelink = "https://blog.0x32.co.uk/index.xml"

[taxonomies]
  category = "categories"
  tag = "tags"

# Hugo's default [related] config scores on "keywords" (unused here) and "tags"
# against a threshold of 80, which this site's tag-only front matter can never
# reach - so the theme's built-in related-posts sidebar was rendering nothing.
# Score on tags and categories instead, with a threshold that actually surfaces
# matches.
[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10

# Individual tag term pages (2000+, many with a single post) are thin,
# near-duplicate content that isn't worth indexing - keep them out of the
# sitemap. The /tags/ index and /categories/ (only ~17, curated) still list.
[[cascade]]
  [cascade.target]
    kind = "term"
    path = "/tags/**"
  [cascade.sitemap]
    disable = true

[deployment]
order = [".jpg$", ".gif$"]

[[deployment.targets]]
# An arbitrary name for this target.
name = "mydeployment"

# S3; see https://gocloud.dev/howto/blob/#s3
# For S3-compatible endpoints, see https://gocloud.dev/howto/blob/#s3-compatible
URL = "s3://blog.0x32.co.uk?region=eu-west-1"

# [[deployment.matchers]] configure behavior for files that match the Pattern.
# See https://golang.org/pkg/regexp/syntax/ for pattern syntax.
# Pattern searching is stopped on first match.

# Samples:

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = false

[[deployment.matchers]]
# Set custom content type for /sitemap.xml
pattern = "^sitemap\\.xml$"
contentType = "application/xml"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(html|xml|json)$"
gzip = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

