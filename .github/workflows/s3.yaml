name: Hugo Build and Deploy to S3

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

# hugo deploy syncs the bucket to its own build, deleting anything it doesn't
# know about. Two overlapping master deploys (e.g. PRs merged seconds apart)
# can let the older build delete the newer post, so run them one at a time.
# PR build checks get their own group (their ref differs) and never queue here.
concurrency:
  group: s3-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v7
      
      - name: Build and deploy
        uses: alastairhm/deploy-hugo-to-s3-action@main
        with:
          hugo-version: 0.166.0
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
